[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]


[project]
authors = [
    { email = "arc.collaborations@ucl.ac.uk", name = "Centre for Advanced Research Computing" },
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["pytest", "pytest-benchmark", "tox", "jsonschema", "pooch"]
description = "zarr benchmarks"
license = { file = "LICENSE" }
name = "zarr_benchmarks"
readme = "README.md"
requires-python = "==3.13.*"
version = "0.0.1"

[project.optional-dependencies]
dev = ["pre-commit"]
plots = ["matplotlib", "seaborn", "pandas"]
tensorstore = ["tensorstore==0.1.76"]
zarr-python-v2 = ["numcodecs==0.15.1", "zarr==2.18.7"]
zarr-python-v3 = ["numcodecs==0.16.2", "zarr==3.1.1"]

[tool.uv]
conflicts = [[{ extra = "zarr-python-v2" }, { extra = "zarr-python-v3" }]]

[project.urls]
Homepage = "https://github.com/HEFTIEProject/zarr-benchmarks"
Issues = "https://github.com/HEFTIEProject/zarr-benchmarks/issues"

[tool.pytest]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["tensorstore", "zarr_python", "n5"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
zarr_benchmarks = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
plots = { features = ["plots"], solve-group = "default" }
tensorstore = { features = ["tensorstore"], solve-group = "default" }
zarr-python-v2 = { features = ["zarr-python-v2"], solve-group = "zarr2" }
zarr-python-v3 = { features = ["zarr-python-v3"], solve-group = "zarr3" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pandas = ">=2.3.3,<3"
seaborn = ">=0.13.2,<0.14"
